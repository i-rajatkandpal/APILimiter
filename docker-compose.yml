version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: limiter-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: limiter_db
      POSTGRES_USER: limiter_user
      POSTGRES_PASSWORD: limiter_pass
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U limiter_user -d limiter_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: